<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khader Hammad | Profile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Rye&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #0d0805;
            background-image: 
                radial-gradient(ellipse at top, rgba(139, 69, 19, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(139, 0, 0, 0.08) 0%, transparent 50%);
            color: #f5e6c8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
        }

        /* ============ 1. شاشة الدخول - مع فيديو RDR2 ============ */
        #entry-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }

        #intro-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.85) contrast(1.05) saturate(1.1);
        }

        #entry-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.7) 100%),
                linear-gradient(180deg, rgba(13, 8, 5, 0.4) 0%, rgba(0, 0, 0, 0.5) 100%);
            z-index: 1;
            pointer-events: none;
        }

        #entry-screen h1 {
            font-family: 'Rye', serif;
            font-size: 42px;
            letter-spacing: 12px;
            color: #c9a961;
            animation: rdrPulse 3s ease-in-out infinite;
            text-align: center;
            text-shadow: 
                0 0 15px rgba(201, 169, 97, 0.9),
                0 0 30px rgba(201, 169, 97, 0.6),
                0 0 60px rgba(139, 69, 19, 0.5),
                0 3px 6px rgba(0, 0, 0, 1);
            position: relative;
            padding: 20px 40px;
            z-index: 2;
        }

        #entry-screen h1::before {
            content: '✦ ─── ✦ ─── ✦';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 8px;
            color: rgba(201, 169, 97, 0.7);
            font-family: serif;
            animation: rdrFlicker 2s ease-in-out infinite;
        }

        #entry-screen h1::after {
            content: '✦ ─── ✦ ─── ✦';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 8px;
            color: rgba(201, 169, 97, 0.7);
            font-family: serif;
            animation: rdrFlicker 2s ease-in-out infinite;
        }

        #entry-screen::after {
            content: 'press anywhere to begin your journey';
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 4px;
            color: rgba(201, 169, 97, 0.8);
            animation: rdrFlicker 2.5s ease-in-out infinite;
            white-space: nowrap;
            z-index: 2;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 1);
        }

        @keyframes rdrPulse {
            0%, 100% { 
                opacity: 0.85; 
                transform: scale(1);
            }
            50% { 
                opacity: 1; 
                transform: scale(1.02);
            }
        }

        @keyframes rdrFlicker {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============ 2. خلفية الفيديو للبروفايل ============ */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(1) contrast(1.05) saturate(1.1);
            display: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(13, 8, 5, 0.5) 100%);
            z-index: -1;
            display: none;
        }

        /* ============ 3. البطاقة الفخمة ============ */
        .container {
            height: 340px;
            width: 270px;
            color: #f5e6c8;
            perspective: 1200px;
            font-family: 'Playfair Display', serif;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s;
            display: none;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -25px;
            border-radius: 3rem;
            background: radial-gradient(
                circle,
                rgba(201, 169, 97, 0.35) 0%,
                rgba(139, 69, 19, 0.2) 35%,
                rgba(139, 0, 0, 0.1) 55%,
                transparent 75%
            );
            filter: blur(30px);
            z-index: -1;
            opacity: 0.6;
            animation: campfireGlow 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes campfireGlow {
            0% { opacity: 0.5; transform: scale(0.96); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1.06); }
        }

        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0d0805 0%, #1a0f08 50%, #0d0805 100%);
            border-radius: 1.2rem;
            position: relative;
            transition: transform 1500ms cubic-bezier(0.19, 1, 0.22, 1);
            transform-style: preserve-3d;
            box-shadow: 
                0 0 50px rgba(139, 69, 19, 0.4),
                0 0 100px rgba(139, 0, 0, 0.15),
                inset 0 0 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(201, 169, 97, 0.25);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 0.9rem;
            border: 2px solid transparent;
            background: 
                linear-gradient(#0d0805, #0d0805) padding-box,
                linear-gradient(135deg, 
                    #c9a961 0%, 
                    #8b4513 25%, 
                    #8b0000 50%, 
                    #8b4513 75%, 
                    #c9a961 100%
                ) border-box;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
            box-shadow: 
                inset 0 0 15px rgba(201, 169, 97, 0.2),
                0 0 15px rgba(0, 0, 0, 0.8);
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 0.7rem;
            border: 1px dashed rgba(201, 169, 97, 0.25);
            pointer-events: none;
            z-index: 2;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 14%;
            position: absolute;
            width: 60%;
            background: linear-gradient(180deg, 
                #2a1810 0%, 
                #1a0f08 50%, 
                #0d0805 100%);
            border: 2px solid #c9a961;
            border-top: none;
            border-radius: 0 0 0.8rem 0.8rem;
            box-shadow: 
                0px 4px 20px rgba(0, 0, 0, 0.9),
                inset 0 -4px 10px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(201, 169, 97, 0.3);
            top: 0;
            left: 20%;
            z-index: 10;
            overflow: hidden;
        }

        .card-top::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(201, 169, 97, 0.15), 
                transparent);
            animation: cardTopShine 4s infinite;
        }

        @keyframes cardTopShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card-top-para {
            font-size: 12px;
            font-weight: 700;
            color: #c9a961;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px rgba(201, 169, 97, 0.7),
                0 1px 0 rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 1;
            font-family: 'Rye', 'Cinzel Decorative', serif;
        }

        .container:hover > .card {
            cursor: pointer;
            transform: rotateX(180deg) rotateZ(-180deg);
        }

        .front,
        .back {
            height: 100%;
            width: 100%;
            border-radius: 1.2rem;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px;
            overflow: hidden;
        }

        .front {
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(201, 169, 97, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 0, 0, 0.08) 0%, transparent 60%),
                linear-gradient(145deg, #1a0f08 0%, #0d0805 100%);
        }

        .back {
            background: 
                radial-gradient(ellipse at 50% 100%, rgba(201, 169, 97, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(139, 0, 0, 0.08) 0%, transparent 60%),
                linear-gradient(145deg, #1a0f08 0%, #0d0805 100%);
            transform: rotateX(180deg) rotateZ(-180deg);
        }

        .heading {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            font-family: 'Rye', 'Cinzel Decorative', serif;
            background: linear-gradient(
                180deg, 
                #fff5d6 0%, 
                #c9a961 50%, 
                #8b4513 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: 
                drop-shadow(0 0 8px rgba(201, 169, 97, 0.8))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 1));
            padding: 6px 10px;
            position: relative;
            z-index: 3;
        }

        .heading::after {
            content: '';
            display: block;
            width: 60%;
            height: 1px;
            margin: 6px auto 0;
            background: linear-gradient(90deg, 
                transparent, 
                #c9a961, 
                transparent);
            box-shadow: 0 0 8px rgba(201, 169, 97, 0.6);
        }

        .follow {
            font-size: 13px;
            font-weight: 500;
            color: #f5e6c8;
            text-align: center;
            letter-spacing: 2px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            opacity: 1;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(201, 169, 97, 0.3);
            text-shadow: 
                0 0 8px rgba(201, 169, 97, 0.5),
                0 1px 2px rgba(0, 0, 0, 1);
            position: relative;
            z-index: 3;
        }

        .profile-img-card {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #c9a961;
            outline: 2px solid #2a1810;
            outline-offset: -6px;
            box-shadow: 
                0 0 30px rgba(201, 169, 97, 0.7),
                0 0 60px rgba(139, 69, 19, 0.4),
                inset 0 0 20px rgba(0, 0, 0, 0.6),
                0 10px 25px rgba(0, 0, 0, 0.95);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 3;
            filter: contrast(1.1) saturate(1.15) brightness(1.05);
        }

        .profile-img-card:hover {
            transform: scale(1.1) rotate(3deg);
            border-color: #fff5d6;
            box-shadow: 
                0 0 45px rgba(201, 169, 97, 1),
                0 0 90px rgba(139, 69, 19, 0.7),
                inset 0 0 20px rgba(0, 0, 0, 0.6);
            filter: contrast(1.15) saturate(1.2) brightness(1.1);
        }

        .icons {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 10px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            position: relative;
            z-index: 3;
        }

        .container:hover .icons {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition-delay: 0.3s;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 30%, #3d2817 0%, #1a0f08 70%, #0d0805 100%);
            border: 2px solid #c9a961;
            color: #c9a961;
            font-size: 22px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(201, 169, 97, 0.4),
                inset 0 1px 0 rgba(201, 169, 97, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 10px rgba(201, 169, 97, 0.7);
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #c9a961 0%, #8b4513 50%, #8b0000 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            border-radius: 50%;
        }

        .icon-btn:hover {
            color: #0d0805;
            border-color: #fff5d6;
            box-shadow: 
                0 0 30px rgba(201, 169, 97, 1),
                0 0 60px rgba(139, 69, 19, 0.7),
                inset 0 0 12px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px) scale(1.18);
            text-shadow: none;
        }

        .icon-btn:hover::before {
            opacity: 1;
        }

        /* ============ 4. عداد الزوار ============ */
        .visitor-counter {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 8, 5, 0.85);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(201, 169, 97, 0.3);
            backdrop-filter: blur(10px);
            font-family: 'Cinzel Decorative', serif;
            font-size: 15px;
            letter-spacing: 2px;
            color: #c9a961;
            opacity: 0;
            transition: opacity 1.5s ease 1.5s;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.7),
                inset 0 0 15px rgba(201, 169, 97, 0.05);
        }

        .visitor-counter i {
            color: #c9a961;
            animation: blink 3s infinite;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(201, 169, 97, 0.6);
        }

        /* ============ 5. مشغل الموسيقى ============ */
        .music-player {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(13, 8, 5, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(201, 169, 97, 0.25);
            border-radius: 20px;
            padding: 12px 20px 12px 12px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.9),
                inset 0 0 20px rgba(201, 169, 97, 0.05);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 1s;
            z-index: 100;
            min-width: 320px;
        }

        .music-player.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(201, 169, 97, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            flex-shrink: 0;
        }

        .album-art.playing {
            animation: albumPulse 2s infinite ease-in-out;
        }

        @keyframes albumPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(201, 169, 97, 0.4); }
        }

        .track-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .track-title {
            font-family: 'Rye', 'Cinzel Decorative', serif;
            font-size: 13px;
            color: #c9a961;
            letter-spacing: 1px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 10px rgba(201, 169, 97, 0.3);
        }

        .track-artist {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 11px;
            color: #8b7355;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            color: #8b7355;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .volume-icon:hover { color: #c9a961; }

        .volume-bar {
            flex: 1;
            height: 4px;
            background: rgba(201, 169, 97, 0.15);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .volume-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #8b4513, #c9a961);
            border-radius: 4px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(201, 169, 97, 0.6);
        }

        .play-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(26, 15, 8, 0.8);
            border: 1px solid rgba(201, 169, 97, 0.4);
            color: #c9a961;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(201, 169, 97, 0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #c9a961, #8b4513);
            color: #0d0805;
            border-color: #c9a961;
            box-shadow: 0 0 25px rgba(201, 169, 97, 0.7);
            transform: scale(1.1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        @media (max-width: 600px) {
            .music-player {
                left: 15px; right: 15px; bottom: 15px; min-width: auto;
            }
            .visitor-counter {
                top: 15px; right: 15px; padding: 8px 16px; font-size: 12px;
            }
            .container { height: 300px; width: 240px; }
            #entry-screen h1 { font-size: 26px; letter-spacing: 6px; }
            #entry-screen h1::before,
            #entry-screen h1::after { font-size: 9px; letter-spacing: 5px; }
            #entry-screen::after { font-size: 10px; letter-spacing: 2px; }
            .profile-img-card { width: 90px; height: 90px; }
            .heading { font-size: 17px; }
            .follow { font-size: 11px; }
            .icon-btn { width: 42px; height: 42px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول مع فيديو RDR2 -->
    <div id="entry-screen">
        <video id="intro-video" autoplay muted loop playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
        </video>
        <h1>CLICK TO ENTER</h1>
    </div>

    <!-- فيديو الخلفية للبروفايل (بدون muted - الصوت من الفيديو نفسه) -->
    <video class="video-bg" id="bg-video" loop playsinline preload="auto">
        <source src="background.mp4" type="video/mp4">
    </video>
    
    <div class="overlay" id="overlay"></div>

    <div class="visitor-counter" id="counter">
        <i class="fa-solid fa-eye"></i>
        <span id="visitor-count">...</span>
    </div>

    <div class="music-player" id="music-player">
        <img src="profile.jpg" alt="Album Art" class="album-art" id="album-art">
        
        <div class="track-info">
            <div class="track-title" id="track-title">KHADER HAMMAD</div>
            <div class="track-artist" id="track-artist">Now Playing</div>
            
            <div class="volume-container">
                <i class="fa-solid fa-volume-high volume-icon" id="volume-icon"></i>
                <div class="volume-bar" id="volume-bar">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </div>
        
        <button class="play-btn" id="play-btn">
            <i class="fa-solid fa-pause" id="play-icon"></i>
        </button>
    </div>

    <!-- البطاقة الفخمة -->
    <div class="container" id="card">
        <div class="card">
            <div class="card-top">
                <p class="card-top-para">KHADER</p>
            </div>

            <div class="front">
                <img src="profile.jpg" alt="Khader Hammad" class="profile-img-card">
                <div class="heading">KHADER HAMMAD</div>
                <div class="follow">Umm al-Fahm, Israel</div>
                <div class="icons">
                    <a href="https://www.tiktok.com/@khader373?is_from_webapp=1&sender_device=pc" target="_blank" class="icon-btn" title="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://discord.gg/mJGvFAAH" target="_blank" class="icon-btn" title="Discord">
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </div>
            </div>

            <div class="back">
                <div class="heading">FOLLOW ME</div>
                <div class="follow">Passion to Impact</div>
                <div class="icons">
                    <a href="https://www.tiktok.com/@khader373?is_from_webapp=1&sender_device=pc" target="_blank" class="icon-btn" title="TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://discord.gg/mJGvFAAH" target="_blank" class="icon-btn" title="Discord">
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const entryScreen = document.getElementById('entry-screen');
        const introVideo = document.getElementById('intro-video');
        const bgVideo = document.getElementById('bg-video');
        const overlay = document.getElementById('overlay');
        const card = document.getElementById('card');
        const counter = document.getElementById('counter');
        const musicPlayer = document.getElementById('music-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeBar = document.getElementById('volume-bar');
        const volumeFill = document.getElementById('volume-fill');
        const volumeIcon = document.getElementById('volume-icon');
        const albumArt = document.getElementById('album-art');
        const trackArtist = document.getElementById('track-artist');

        // ===== 1. تشغيل فيديو المقدمة تلقائياً (بدون صوت) =====
        introVideo.muted = true;
        introVideo.loop = true;
        introVideo.play().catch(e => console.log("Intro autoplay blocked:", e));

        // ===== 2. تجهيز فيديو الخلفية (مكتوم مؤقتاً) =====
        overlay.style.display = 'block';
        bgVideo.style.display = 'block';
        bgVideo.muted = true;
        bgVideo.volume = 0.4;
        bgVideo.pause();

        // أحداث الفيديو
        bgVideo.addEventListener('playing', () => { trackArtist.innerText = 'Now Playing'; });
        bgVideo.addEventListener('waiting', () => { trackArtist.innerText = 'Buffering...'; });
        bgVideo.addEventListener('error', (e) => console.log("Video error:", e));

        // ===== 3. عند الضغط على شاشة الدخول (في أي لحظة) =====
        let entered = false;
        entryScreen.addEventListener('click', async () => {
            if (entered) return;
            entered = true;

            // ===== أ. رفع muted عن فيديو المقدمة لتشغيل صوته =====
            introVideo.muted = false;
            introVideo.volume = 0.7;
            // إعادة تشغيل الفيديو لضمان بدء الصوت من البداية بشكل متزامن
            introVideo.currentTime = 0;
            introVideo.play().catch(e => console.log("Intro play error:", e));

            // ===== ب. إخفاء شاشة الدخول فوراً =====
            entryScreen.style.opacity = '0';
            setTimeout(() => { 
                entryScreen.style.display = 'none';
                introVideo.pause();
                introVideo.muted = true;
            }, 800);

            // ===== ج. تشغيل فيديو الخلفية مع صوته (متزامن 100%) =====
            bgVideo.currentTime = 0;
            bgVideo.muted = false;
            bgVideo.volume = 0.4;
            
            try {
                await bgVideo.play();
                trackArtist.innerText = 'Now Playing';
            } catch (e) {
                console.log("bgVideo play error:", e);
                // محاولة احتياطية: تشغيل muted ثم رفع الصوت
                bgVideo.muted = true;
                try {
                    await bgVideo.play();
                    bgVideo.muted = false;
                    trackArtist.innerText = 'Now Playing';
                } catch (e2) {
                    console.log("Fallback failed:", e2);
                    trackArtist.innerText = 'اضغط زر التشغيل';
                }
            }

            // ===== د. إظهار العناصر =====
            card.style.display = 'block';
            counter.style.display = 'flex';

            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
                counter.style.opacity = '1';
                musicPlayer.classList.add('visible');
                albumArt.classList.add('playing');
            }, 100);

            updateVolumeUI();
        });

        // ===== 4. إعادة تشغيل الفيديو عند الانتهاء =====
        bgVideo.addEventListener('ended', () => {
            bgVideo.currentTime = 0;
            bgVideo.play().catch(e => console.log("Video loop error:", e));
        });

        // ===== 5. التحكم بالموسيقى (نفس الفيديو) =====
        playBtn.addEventListener('click', () => {
            if (bgVideo.paused) {
                bgVideo.play().catch(e => console.log(e));
                playIcon.className = 'fa-solid fa-pause';
                albumArt.classList.add('playing');
            } else {
                bgVideo.pause();
                playIcon.className = 'fa-solid fa-play';
                albumArt.classList.remove('playing');
            }
        });

        // ===== 6. التحكم بمستوى الصوت (على الفيديو) =====
        let isDragging = false;

        function setVolume(e) {
            const rect = volumeBar.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let percent = Math.max(0, Math.min(1, x / rect.width));
            bgVideo.volume = percent;
            volumeFill.style.width = (percent * 100) + '%';
            updateVolumeIcon(percent);
        }

        function updateVolumeUI() {
            volumeFill.style.width = (bgVideo.volume * 100) + '%';
            updateVolumeIcon(bgVideo.volume);
        }

        function updateVolumeIcon(vol) {
            volumeIcon.className = 'volume-icon fa-solid ' + 
                (vol === 0 ? 'fa-volume-xmark' : 
                 vol < 0.5 ? 'fa-volume-low' : 
                 'fa-volume-high');
        }

        volumeBar.addEventListener('mousedown', (e) => { isDragging = true; setVolume(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) setVolume(e); });
        document.addEventListener('mouseup', () => { isDragging = false; });

        volumeBar.addEventListener('touchstart', (e) => { isDragging = true; setVolume(e); });
        document.addEventListener('touchmove', (e) => { if (isDragging) setVolume(e); });
        document.addEventListener('touchend', () => { isDragging = false; });

        volumeIcon.addEventListener('click', () => {
            if (bgVideo.volume > 0) {
                bgVideo.dataset.prevVolume = bgVideo.volume;
                bgVideo.volume = 0;
            } else {
                bgVideo.volume = bgVideo.dataset.prevVolume || 0.4;
            }
            updateVolumeUI();
        });

        // ===== 7. عداد الزوار =====
        (function () {
            const el = document.getElementById('visitor-count');
            const NS = 'khader-hammad-profile', KEY = 'visits';
            const cached = parseInt(localStorage.getItem('khader-count') || '0', 10);
            if (cached > 0) el.innerText = cached.toLocaleString();
            const last = parseInt(localStorage.getItem('khader-last') || '0', 10);
            const now = Date.now();
            const url = (now - last < 10000)
                ? `https://abacus.jasoncameron.dev/get/${NS}/${KEY}`
                : `https://abacus.jasoncameron.dev/hit/${NS}/${KEY}`;
            if (now - last >= 10000) localStorage.setItem('khader-last', String(now));
            fetch(url)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(d => {
                    el.innerText = Number(d.value).toLocaleString();
                    localStorage.setItem('khader-count', d.value);
                })
                .catch(() => {
                    el.innerText = cached > 0 ? cached.toLocaleString() : '1';
                });
        })();
    </script>

</body>
